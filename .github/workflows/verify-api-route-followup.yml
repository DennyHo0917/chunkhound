name: API Route follow-up validation
on:
  push:
    branches: [verify/api-route-followup-20261014]
permissions:
  contents: read
jobs:
  compare:
    name: full-suite-with-interactive-test-isolation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CHUNKHOUND_USE_EXISTING_SITE_DIST: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Resolve docs version
        run: bash scripts/resolve_docs_version.sh
      - name: Install and build website
        run: |
          npm ci --prefix site
          npm run build --prefix site
      - name: Install dependencies
        run: uv sync --locked
      - name: Build current native extension
        uses: ./.github/actions/build-rust-extension
      - name: Warm script runner cache
        run: npm exec --prefix site -- node --version
      - name: Run smoke tests
        run: uv run pytest tests/test_smoke.py -v -n auto
      - name: Verify interactive test with inherited MCP mode
        run: CHUNKHOUND_MCP_MODE=1 uv run pytest tests/integration/test_cli_timeout_prompt_real.py -v
      - name: Run complete suite with the previous verification settings
        run: uv run pytest tests/ -v -n 4 --dist=loadfile --junit-xml=test-results.xml
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-fixed
          path: test-results.xml
